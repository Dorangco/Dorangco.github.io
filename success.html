<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotation Sent | DorangCo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: white;
            padding: 50px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
            max-width: 400px;
        }
        .icon {
            font-size: 60px;
            color: #d4a017;
            margin-bottom: 20px;
        }
        h1 { color: #111; margin: 0 0 10px 0; font-size: 28px; }
        p { color: #555; margin-bottom: 30px; line-height: 1.5; }
        .btn {
            background: #d4a017;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s;
            display: inline-block;
        }
        .btn:hover { background: #b38712; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">✓</div>
        <h1>Quotation Sent!</h1>
        <p>Thank you for reaching out to DorangCo. We have received your request and will contact you shortly.</p>
        <a href="index.html" class="btn">Back to Website</a>
    </div>
</body>
</html>
